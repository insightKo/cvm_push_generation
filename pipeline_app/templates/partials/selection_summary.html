<div class="row">
  <div><h3>Выбрано акций</h3><div class="kpi sm">{{ selected | length }} из {{ rows | length }}</div></div>
  <div style="flex:1"></div>
  {% if selected %}
    <a class="btn purple" href="/step4">К механике и экономике →</a>
  {% endif %}
</div>
{% if selected %}
<div class="row" style="margin-top:12px">
  {% for r in rows if r.num in selected %}
    <span class="badge purple">{{ r.name }}</span>
  {% endfor %}
</div>
{% endif %}
