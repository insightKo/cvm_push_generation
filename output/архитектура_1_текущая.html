<meta charset="utf-8">
<title>Текущая архитектура CVM</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color:#1f2937; background:#ffffff; margin: 20px 32px; }
  h1 { font-size: 22px; margin: 6px 0 2px; }
  .sub { color:#6b7280; font-size: 13px; margin-bottom: 10px; }
  .legend { font-size: 12.5px; color:#374151; margin: 4px 0 14px; }
  .legend span { margin-right: 18px; }
  .sw { display:inline-block; width:26px; height:0; border-top:3px solid #6b7280; vertical-align:middle; margin-right:6px; }
  .sw.red { border-top:3px dashed #dc2626; }
  svg { width:100%; height:auto; display:block; }
  @page { size: A4 landscape; margin: 8mm; }
  @media print {
    body { margin: 2mm 6mm; }
    h1 { font-size: 18px; margin: 0 0 1px; }
    .sub { font-size: 11px; margin-bottom: 3px; }
    .legend { font-size: 10.5px; margin: 1px 0 4px; }
    svg { height: 158mm; width: auto; max-width: 100%; margin: 0 auto; }
  }
  svg text { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill:#1f2937; }
  .zone   { fill:none; stroke:#9ca3af; stroke-width:1.6; stroke-dasharray:7 5; }
  .zlabel { font-size:14px; font-weight:700; fill:#6b7280; }
  .t  { font-size:14px; font-weight:700; }
  .s  { font-size:11.5px; fill:#374151; }
  .al { font-size:11px; fill:#6b7280; }
  .flr{ font-size:12.5px; font-weight:600; fill:#dc2626; }
  .flo{ font-size:12.5px; font-weight:600; fill:#d97706; }
  .flg{ font-size:12.5px; font-weight:600; fill:#374151; }
  .b-green  { fill:#ecfdf5; stroke:#059669; stroke-width:1.6; }
  .b-amber  { fill:#fffbeb; stroke:#d97706; stroke-width:1.6; }
  .b-violet { fill:#eef2ff; stroke:#4f46e5; stroke-width:1.6; }
  .b-gray   { fill:#f9fafb; stroke:#6b7280; stroke-width:1.4; }
  .b-red    { fill:#fef2f2; stroke:#dc2626; stroke-width:1.6; }
  .ar  { stroke:#6b7280; stroke-width:2; fill:none; marker-end:url(#m); }
  .arr { stroke:#dc2626; stroke-width:2; fill:none; stroke-dasharray:6 5; marker-end:url(#mr); }
  .aro { stroke:#d97706; stroke-width:2; fill:none; stroke-dasharray:2 4; marker-end:url(#mo); }
</style>

<h1>Текущая архитектура CVM (as-is)</h1>
<div class="sub">ДИКСИ · Manzana · MCI · август 2026 — данные подписаны на стрелках</div>
<div class="legend">
  <span><span class="sw"></span>автоматический поток</span>
  <span><span class="sw red"></span>вручную (сотрудники ДИКСИ)</span>
  <span><span class="sw" style="border-top:3px dotted #d97706"></span>полуавтомат ДИКСИ</span>
</div>

<svg viewBox="0 0 1240 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="m" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#6b7280"/></marker>
    <marker id="mr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#dc2626"/></marker>
    <marker id="mo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#d97706"/></marker>
  </defs>

  <!-- зона ДИКСИ -->
  <rect class="zone" x="30" y="70" width="220" height="660" rx="14"/>
  <text class="zlabel" x="46" y="94">ДИКСИ</text>
  <rect class="b-amber" x="50" y="112" width="180" height="66" rx="10"/>
  <text class="t" x="140" y="139" text-anchor="middle">Касса</text>
  <text class="s" x="140" y="159" text-anchor="middle">чеки, механики</text>
  <rect class="b-amber" x="50" y="500" width="180" height="66" rx="10"/>
  <text class="t" x="140" y="527" text-anchor="middle">Приложение</text>
  <text class="s" x="140" y="547" text-anchor="middle">PUSH · купоны · подборки</text>
  <rect class="b-amber" x="50" y="620" width="180" height="60" rx="10"/>
  <text class="t" x="140" y="645" text-anchor="middle">Чековая лента</text>
  <text class="s" x="140" y="664" text-anchor="middle">slip-купоны</text>

  <!-- зона Manzana -->
  <rect class="zone" x="290" y="70" width="430" height="660" rx="14"/>
  <text class="zlabel" x="306" y="94">Manzana</text>

  <rect class="b-green" x="310" y="112" width="390" height="80" rx="10"/>
  <text class="t" x="505" y="140" text-anchor="middle">Manzana Online</text>
  <text class="s" x="505" y="159" text-anchor="middle">мастер: расчёт и заведение акций, купоны,</text>
  <text class="s" x="505" y="175" text-anchor="middle">хранение клиентских данных</text>

  <rect class="b-gray" x="310" y="238" width="150" height="46" rx="10"/>
  <text class="t" x="385" y="266" text-anchor="middle">stage</text>

  <rect class="b-green" x="310" y="324" width="390" height="62" rx="10"/>
  <text class="t" x="505" y="349" text-anchor="middle">CDP (ClickHouse)</text>
  <text class="s" x="505" y="368" text-anchor="middle">данные льются каждую минуту</text>

  <rect class="b-green" x="310" y="424" width="390" height="106" rx="10"/>
  <text class="t" x="505" y="465" text-anchor="middle">MCI (MS SQL) — наше решение</text>
  <text class="s" x="505" y="490" text-anchor="middle">заливка из CDP — каждую ночь (лаг до суток)</text>

  <rect class="b-green" x="310" y="566" width="390" height="80" rx="10"/>
  <text class="t" x="505" y="594" text-anchor="middle">Manzana Campaign</text>
  <text class="s" x="505" y="613" text-anchor="middle">мастер коммуникаций:</text>
  <text class="s" x="505" y="629" text-anchor="middle">PUSH · e-mail · SMS</text>

  <!-- зона MCI + сотрудники ДИКСИ -->
  <rect class="zone" x="780" y="70" width="430" height="660" rx="14"/>
  <text class="zlabel" x="796" y="94">MCI + сотрудники ДИКСИ (сейчас)</text>

  <rect class="b-violet" x="800" y="112" width="390" height="86" rx="10"/>
  <text class="t" x="995" y="142" text-anchor="middle">Google-таблица «CVM offline» + файлы</text>
  <text class="s" x="995" y="164" text-anchor="middle">сетка · тексты · slip · подборки · списки CRM_GUID</text>
  <text class="s" x="995" y="182" text-anchor="middle">наши материалы для заведения</text>

  <rect class="b-red" x="800" y="640" width="390" height="44" rx="10"/>
  <text class="s" x="995" y="667" text-anchor="middle" style="font-weight:700">Сверка «всё ли заведено» — глазами, вручную</text>

  <!-- поток транзакций -->
  <path class="ar" d="M230,145 L310,145"/>
  <path class="ar" d="M470,192 L400,238"/>
  <path class="ar" d="M385,284 L465,324"/>
  <path class="ar" d="M505,386 L505,424"/>

  <!-- факты отправок: Campaign → CDP (внутри зоны) -->
  <path class="ar" d="M310,620 L298,620 L298,362 L310,362"/>
  <rect fill="#ffffff" x="248" y="396" width="102" height="19" rx="3"/>
  <text class="flg" x="299" y="410" text-anchor="middle" style="font-size:11.5px">факты отправок</text>

  <!-- SQL-выборки: MCI → файлы -->
  <path class="ar" d="M700,477 L706,477 L706,126 L800,126"/>
  <text class="flg" x="748" y="117" text-anchor="middle">SQL-выборки</text>

  <!-- условия акций: гугл → Online (вручную) -->
  <path class="arr" d="M1090,198 L1090,232 L724,232 L724,150 L700,150"/>
  <text class="flr" x="905" y="225" text-anchor="middle">условия акций — вручную</text>

  <!-- slip-купоны: гугл → Online (вручную) -->
  <path class="arr" d="M1115,198 L1115,274 L712,274 L712,172 L700,172"/>
  <text class="flr" x="915" y="267" text-anchor="middle">slip-купоны — вручную</text>

  <!-- списки CRM_GUID: гугл → Campaign (вручную) -->
  <path class="arr" d="M1140,198 L1140,316 L736,316 L736,600 L700,600"/>
  <text class="flr" x="940" y="309" text-anchor="middle">списки CRM_GUID — загрузка вручную</text>

  <!-- пуши: гугл → Campaign (вручную) -->
  <path class="arr" d="M1165,198 L1165,358 L748,358 L748,578 L700,578"/>
  <text class="flr" x="957" y="351" text-anchor="middle">пуши + настройка кампаний — вручную</text>

  <!-- подборки: гугл → приложение (полуавтомат) -->
  <path class="aro" d="M1185,198 L1185,400 L760,400 L760,712 L240,712 L240,522 L230,522"/>
  <text class="flo" x="975" y="393" text-anchor="middle">подборки: товары + генерация ссылок</text>

  <!-- купоны: Online → приложение (полуавтомат) -->
  <path class="aro" d="M310,165 L250,165 L250,516 L230,516"/>
  <rect fill="#ffffff" x="216" y="340" width="66" height="19" rx="3"/>
  <text class="flo" x="249" y="354" text-anchor="middle" style="font-size:11.5px">купоны</text>

  <!-- Online/Campaign → клиенты -->
  <path class="ar" d="M310,132 L230,132"/>
  <text class="al" x="270" y="124" text-anchor="middle">механика</text>
  <path class="ar" d="M310,613 L262,613 L262,533 L230,533"/>
  <rect fill="#ffffff" x="238" y="566" width="48" height="19" rx="3"/>
  <text class="flg" x="262" y="580" text-anchor="middle" style="font-size:11.5px">PUSH</text>
  <path class="ar" d="M310,182 L276,182 L276,650 L230,650"/>
  <rect fill="#ffffff" x="192" y="625" width="84" height="19" rx="3"/>
  <text class="flg" x="234" y="639" text-anchor="middle" style="font-size:11.5px">slip в чеке</text>
</svg>
