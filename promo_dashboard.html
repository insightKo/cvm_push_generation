<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ДИКСИ · Оптимизация промо</title>
<style>
:root{
  --bg:#f7f4f1; --surface:#ffffff; --ink:#241e18; --muted:#8b8177; --line:#ece7e1;
  --brand:#ff6a13; --brand2:#e85b06;
  --c-orange:#e85b06; --c-purple:#6c2bd9; --c-green:#1aa34a; --c-amber:#a16207;
  --soft-orange:#ffe2b8; --gray-mark:#8b8177;
  --shadow:0 1px 4px rgba(36,30,24,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1c1815; --surface:#262220; --ink:#f1ebe4; --muted:#a1968a; --line:#38322c;
    --c-orange:#e85b06; --c-purple:#8b5cf6; --c-green:#1aa34a; --c-amber:#eda100;
    --soft-orange:#7a3a10; --gray-mark:#867c70; --shadow:none;
  }
}
:root[data-theme="light"]{
  --bg:#f7f4f1; --surface:#ffffff; --ink:#241e18; --muted:#8b8177; --line:#ece7e1;
  --c-orange:#e85b06; --c-purple:#6c2bd9; --c-green:#1aa34a; --c-amber:#a16207;
  --soft-orange:#ffe2b8; --gray-mark:#8b8177; --shadow:0 1px 4px rgba(36,30,24,.06);
}
:root[data-theme="dark"]{
  --bg:#1c1815; --surface:#262220; --ink:#f1ebe4; --muted:#a1968a; --line:#38322c;
  --c-orange:#e85b06; --c-purple:#8b5cf6; --c-green:#1aa34a;
  --soft-orange:#7a3a10; --gray-mark:#867c70; --shadow:none;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:14px; line-height:1.45;
}
.wrap{max-width:1240px; margin:0 auto; padding:20px 20px 48px;}
.header{
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow);
  border-radius:16px; color:var(--ink); padding:14px 22px; margin-bottom:16px;
  display:flex; align-items:center; gap:16px;
}
.logo{display:flex; align-items:center}
.logo img{display:block}
.header h1{margin:0; font-size:20px; font-weight:700; letter-spacing:-.2px;
  border-left:1px solid var(--line); padding-left:16px}
.grid{display:grid; grid-template-columns:264px 1fr; gap:16px; align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow); padding:16px;}
.rail{position:sticky; top:16px; display:flex; flex-direction:column; gap:14px}
.rail .lbl{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
select,input[type=text]{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:9px;
  background:var(--surface); color:var(--ink); font:inherit}
input[type=text]::placeholder{color:var(--muted)}
.goals{display:flex; flex-direction:column; gap:8px}
.goal{border:1px solid var(--line); border-radius:10px; padding:8px 12px 10px; cursor:pointer;
  background:var(--surface); color:var(--ink)}
.goal .top{display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; margin-bottom:4px}
.goal .dot{width:9px; height:9px; border-radius:50%; flex:none}
.goal .val{margin-left:auto; font-weight:800; font-size:12.5px; color:var(--brand2); font-variant-numeric:tabular-nums}
.goal input[type=range]{width:100%; accent-color:var(--brand2); margin:0}
.goal input[type=range]:disabled{opacity:.45}
.goal[data-g="to"] .dot{background:var(--c-orange)} .goal[data-g="traffic"] .dot{background:var(--c-purple)} .goal[data-g="check"] .dot{background:var(--c-green)} .goal[data-g="margin"] .dot{background:var(--c-amber)}
.goal[data-active="true"]{border-color:currentColor}
.goal[data-g="to"][data-active="true"]{color:var(--c-orange); background:color-mix(in srgb,var(--c-orange) 8%,var(--surface))}
.goal[data-g="traffic"][data-active="true"]{color:var(--c-purple); background:color-mix(in srgb,var(--c-purple) 8%,var(--surface))}
.goal[data-g="check"][data-active="true"]{color:var(--c-green); background:color-mix(in srgb,var(--c-green) 8%,var(--surface))}
.goal[data-g="margin"][data-active="true"]{color:var(--c-amber); background:color-mix(in srgb,var(--c-amber) 8%,var(--surface))}
.goal:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.slider .row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px}
.slider .name{font-size:12.5px; font-weight:600}
.slider .val{font-size:12.5px; font-weight:800; color:var(--brand2); font-variant-numeric:tabular-nums}
.slider input[type=range]{width:100%; accent-color:var(--brand2)}
.slider .hint{font-size:11px; color:var(--muted); margin-top:1px}

.kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
@media(max-width:900px){.kpis{grid-template-columns:1fr}}
.kpi .k{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
  letter-spacing:.05em; text-transform:uppercase; color:var(--muted)}
.kpi .k .dot{width:8px; height:8px; border-radius:50%}
.kpi .v{font-size:26px; font-weight:800; margin-top:4px; font-variant-numeric:tabular-nums; letter-spacing:-.3px}
.kpi .d{font-size:11.5px; color:var(--muted); margin-top:2px}

.meter .top{display:flex; justify-content:space-between; align-items:baseline}
.meter .top b{font-size:14px}
.meter .pct{font-weight:800; color:var(--brand2); font-variant-numeric:tabular-nums}
.meter .track{height:10px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:8px}
.meter .fill{height:100%; border-radius:999px; background:linear-gradient(90deg,var(--brand),var(--brand2))}
@media(prefers-reduced-motion:no-preference){.meter .fill{transition:width .25s ease}}
.meter .note{font-size:11.5px; color:var(--muted); margin-top:6px}
.meter .mrow+.mrow{margin-top:12px}

.card h2{margin:0 0 2px; font-size:15px; font-weight:700}
.card .sub{font-size:12px; color:var(--muted); margin-bottom:10px}
.main-col{display:flex; flex-direction:column; gap:16px}
svg{display:block}
svg text{font-family:inherit}
.axis{font-size:10.5px; fill:var(--muted)}
.vlab{font-size:10.5px; fill:var(--muted); font-variant-numeric:tabular-nums}
.blab{font-size:11px; fill:var(--muted)}
.legend{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-bottom:8px; flex-wrap:wrap}
.legend span{display:inline-flex; align-items:center; gap:5px}
.legend i{width:9px; height:9px; border-radius:3px; display:inline-block}

.formula{font-size:13px; line-height:1.75; border-top:1px solid var(--line); margin-top:10px; padding-top:10px}
.formula b{font-weight:700}
.tfilters{display:flex; gap:8px; margin:4px 0 10px}
.tfilters input{flex:1}
th.sortable{cursor:pointer; -webkit-user-select:none; user-select:none}
th.sortable:hover{color:var(--ink)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:720px}
thead th{position:sticky; top:0; background:var(--surface)}
th{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
  text-align:left; font-weight:700; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:6px 10px; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right; white-space:nowrap}
td.cat{color:var(--muted); max-width:240px}
.tooltip{position:fixed; pointer-events:none; background:var(--surface); border:1px solid var(--line);
  border-radius:9px; padding:7px 10px; font-size:12px; box-shadow:0 4px 14px rgba(0,0,0,.14);
  z-index:10; display:none; max-width:280px}
.tooltip b{display:block; margin-bottom:2px}
</style>

    <h1>Оптимизация промо</h1>
  </div>

  <div class="grid">
    <aside class="rail">
      <div class="panel">
        <div class="lbl">Месяц</div>
        <select id="month" aria-label="Месяц"></select>
      </div>
      <div class="panel">
        <div class="lbl">Цель</div>
        <div class="goals" role="group" aria-label="Цель и прирост">
          <div class="goal" data-g="to">
            <div class="top"><span class="dot"></span>ТО<span class="val"><span id="vt-to">5</span>%</span></div>
            <input type="range" id="st-to" min="0" max="15" value="5" aria-label="Цель прироста ТО, %">
          </div>
          <div class="goal" data-g="traffic">
            <div class="top"><span class="dot"></span>Трафик<span class="val"><span id="vt-traffic">5</span>%</span></div>
            <input type="range" id="st-traffic" min="0" max="15" value="5" aria-label="Цель прироста трафика, %">
          </div>
          <div class="goal" data-g="check">
            <div class="top"><span class="dot"></span>Средний чек<span class="val"><span id="vt-check">5</span>%</span></div>
            <input type="range" id="st-check" min="0" max="15" value="5" aria-label="Цель прироста среднего чека, %">
          </div>
          <div class="goal" data-g="margin">
            <div class="top"><span class="dot"></span>Маржа<span class="val"><span id="vt-margin">5</span>%</span></div>
            <input type="range" id="st-margin" min="0" max="15" value="5" aria-label="Цель прироста маржи, %">
          </div>
        </div>
      </div>
      <div class="panel" style="display:flex;flex-direction:column;gap:12px">
        <div class="lbl" style="margin:0">Управление</div>
        <div class="slider">
          <div class="row"><span class="name">Лимит товаров от ИИ</span><span class="val" id="v-share"></span></div>
          <input type="range" id="s-share" min="0.05" max="1" step="0.05" value="1" aria-label="Лимит количества товаров от ИИ">
          <div class="hint" id="v-count"></div>
        </div>
        <div class="slider">
          <div class="row"><span class="name">Исключения</span></div>
          <input type="text" id="excl" placeholder="через запятую: виски, кофе…" aria-label="Исключить товары и категории">
        </div>
        <div class="slider">
          <div class="row"><span class="name">Бюджет скидки</span><span class="val"><span id="v-budget">без лимита</span></span></div>
          <input type="range" id="s-budget" min="1" max="50" step="1" value="50" aria-label="Бюджет скидки, млн рублей">
          <div class="hint">расход: <span id="v-spend"></span></div>
        </div>
      </div>
    </aside>

    <div class="main-col">
      <div class="kpis">
        <div class="panel kpi"><div class="k"><span class="dot" style="background:var(--c-orange)"></span>Прогноз доп ТО</div>
          <div class="v" id="k1"></div><div class="d" id="k1d"></div></div>
        <div class="panel kpi"><div class="k"><span class="dot" style="background:var(--c-purple)"></span>Доп чеки</div>
          <div class="v" id="k3"></div><div class="d" id="k3d"></div></div>
        <div class="panel kpi"><div class="k"><span class="dot" style="background:var(--c-green)"></span>К чеку откликнувшихся</div>
          <div class="v" id="k4"></div><div class="d" id="k4d"></div></div>
      </div>

      <div class="panel meter">
        <div id="meters"></div>
      </div>

      <div class="panel card">
        <h2 id="tblTitle"></h2>
        <div class="tfilters">
          <input type="text" id="f-cat" placeholder="фильтр: категория" aria-label="Фильтр по категории">
          <input type="text" id="f-name" placeholder="фильтр: товар" aria-label="Фильтр по товару">
        </div>
        <div class="tbl-wrap"><table id="tbl"></table></div>
      </div>

      <div class="panel card">
        <h2>Как считаем прирост</h2>
        <div class="legend" id="mLegend"></div>
        <div id="chartMonths"></div>
        <div class="formula" id="formula"></div>
      </div>
    </div>
  </div>
</div>

const $ = id => document.getElementById(id);
const state = { month: DATA.months[DATA.months.length-1], goal:"to",
                targets:{to:5, traffic:5, check:5, margin:5}, share:1, excl:"", budget:50,
                tbl:{cat:"", name:"", key:"contrib", dir:-1} };
const PROPOSE_PP = 5; // предлагаем скидку на 5 п.п. больше, не менее того, что было
const MARGIN = 0.33;  // маржа 33% — из data/расчет средних чеков.xlsx
const BUDGET_MAX = 50; // верх ползунка = без лимита
const GOAL_LABELS = {to:"ТО", traffic:"Трафик", check:"Средний чек", margin:"Маржа"};
const GOAL_COLORS = {to:"var(--c-orange)", traffic:"var(--c-purple)",
                     check:"var(--c-green)", margin:"var(--c-amber)"};
const PERIOD = {"июнь":["01.06.2026","30.06.2026"],"июль":["01.07.2026","31.07.2026"],"август":["01.08.2026","31.08.2026"]};

const nf0 = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
const fmtRub = v => Math.abs(v)>=1e9 ? (v/1e9).toLocaleString("ru-RU",{maximumFractionDigits:2})+" млрд ₽"
              : Math.abs(v)>=1e6 ? (v/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1})+" млн ₽"
              : nf0.format(Math.round(v))+" ₽";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function model(){
  const pm = DATA.per_month[state.month];
  const epc = DATA.clients*DATA.resp_avg;               // доп чеков на товар
  const discNew = pm.hist_disc + PROPOSE_PP;
  const excl = state.excl.toLowerCase().split(",").map(s=>s.trim()).filter(Boolean);
  const filt = l => excl.length ? l.filter(c=>!excl.some(e=>(c.name+" "+c.cat).toLowerCase().includes(e))) : l;
  const lists = {to:DATA.to_cands, traffic:DATA.traffic_cands,
                 check:DATA.check_cands, margin:DATA.margin_cands};
  const wantN = Math.max(1, Math.round(DATA.total_sku*state.share/100));
  const budget = state.budget>=BUDGET_MAX ? Infinity : state.budget*1e6;
  const plan = pm.plan_base;
  const g0 = state.goal, t = state.targets[g0];
  // планка выбранной цели в её метрике
  const targets = {
    to:      pm.base_rev*t/100,
    traffic: DATA.clients*t/100,
    check:   DATA.avg_check*t/100,
    margin:  pm.base_rev*MARGIN*t/100};
  const target = targets[g0];
  const picked=[]; let ai=0, sumPrice=0, spend=0, cutReason=null;
  const cur = {to:()=>ai, traffic:()=>picked.length*epc,
               check:()=>picked.length?sumPrice/picked.length:0, margin:()=>ai*MARGIN};
  // товары по порядку скора выбранной цели, пока она не закрыта
  for(const c of filt(lists[g0])){
    if(target<=0 || cur[g0]()>=target) break;
    if(picked.length>=wantN){ cutReason="limit"; break; }
    const s = epc*c.price*discNew/100;
    if(spend+s>budget){ cutReason="budget"; break; }
    spend+=s; ai+=epc*c.price; sumPrice+=c.price;
    picked.push({...c, contrib:epc*c.price});
  }
  const topn=picked.length, checksAdd=topn*epc, avgPrice=sumPrice/Math.max(topn,1);
  const fmts = {to:fmtRub, margin:fmtRub,
    traffic:v=>nf0.format(Math.round(v))+" чеков",
    check:v=>"+"+nf0.format(Math.round(v))+" ₽"};
  const bases = {to:pm.base_rev, traffic:DATA.clients, check:DATA.avg_check, margin:pm.base_rev*MARGIN};
  // выбранная цель — прогресс к планке; остальные — расчёт от полученного набора
  const meters = ["to","traffic","check","margin"].map(g=>{
    const c = cur[g]();
    if(g===g0) return {g, label:GOAL_LABELS[g], color:GOAL_COLORS[g], active:true, pct:t,
      target, cur:c, fmt:fmts[g], closed: target>0 ? Math.min(100, c/target*100) : 100};
    const pctCalc = bases[g] ? c/bases[g]*100 : 0;
    return {g, label:GOAL_LABELS[g], color:GOAL_COLORS[g], active:false, pctCalc,
      cur:c, fmt:fmts[g], fill:Math.min(100, pctCalc/15*100)};
  });
  return {pm, epc, discNew, topn, wantN, cutReason, spend, picked, ai, plan,
          total:plan+ai, checksAdd, avgPrice, meters};
}

const tip = $("tip");
function bindTip(el, html){
  el.addEventListener("mousemove", e=>{
    tip.innerHTML = html; tip.style.display="block";
    const w = tip.offsetWidth;
    tip.style.left = Math.min(e.clientX+14, innerWidth-w-8)+"px";
    tip.style.top  = (e.clientY+14)+"px";
  });
  el.addEventListener("mouseleave", ()=> tip.style.display="none");
}

const NS="http://www.w3.org/2000/svg";
function el(tag, attrs, parent){
  const n=document.createElementNS(NS,tag);
  for(const k in attrs) n.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(n);
  return n;
}

function drawMonths(m){
  const host=$("chartMonths"); host.innerHTML="";
  const W=host.clientWidth||760, H=250, padL=8, padR=8, padB=26, padT=30;
  const others=DATA.months.filter(x=>x!==state.month);
  const items=[...others.map(mm=>({m:mm,base:DATA.month_totals[mm],ai:0})),
               {m:state.month,base:m.plan,ai:m.ai}];
  const svg=el("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`},host);
  const max=Math.max(...items.map(i=>i.base+i.ai), m.pm.hist_avg)*1.18;
  const y=v=>H-padB-(H-padB-padT)*v/max;
  const bw=Math.min(90,(W-padL-padR)/items.length*0.42);
  items.forEach((it,i)=>{
    const cx=padL+(W-padL-padR)*(i+0.5)/items.length;
    const cur=it.m===state.month;
    const b=el("rect",{x:cx-bw/2,y:y(it.base),width:bw,height:H-padB-y(it.base),rx:4,
      style:`fill:${cur?"var(--c-orange)":"var(--gray-mark)"}`},svg);
    bindTip(b,`<b>${it.m}</b>Программа: ${fmtRub(it.base)}`);
    if(it.ai>0){
      const a=el("rect",{x:cx-bw/2,y:y(it.base+it.ai),width:bw,height:y(it.base)-y(it.base+it.ai),rx:4,
        style:"fill:var(--soft-orange);stroke:var(--surface);stroke-width:2"},svg);
      bindTip(a,`<b>Товары ДЦО от ИИ</b>+${fmtRub(it.ai)}`);
    }
    const lab=el("text",{x:cx,y:y(it.base+it.ai)-8,class:"vlab","text-anchor":"middle"},svg);
    lab.textContent=fmtRub(it.base+it.ai)+(it.ai>0?" (с ИИ)":"");
    const ml=el("text",{x:cx,y:H-8,class:"axis","text-anchor":"middle"},svg);
    ml.textContent=it.m+(cur?" · план":"");
  });
  el("line",{x1:padL,x2:W-padR,y1:y(m.pm.hist_avg),y2:y(m.pm.hist_avg),
    stroke:"var(--muted)","stroke-width":1,"stroke-dasharray":"5 4"},svg);
  const bl=el("text",{x:W-padR,y:y(m.pm.hist_avg)-6,class:"blab","text-anchor":"end"},svg);
  bl.textContent=`среднее ${m.pm.hist_label}: ${fmtRub(m.pm.hist_avg)}`;
}

function render(){
  const m=model();

  $("v-share").textContent=`${m.wantN} шт`;
  $("v-count").textContent=`= ${state.share.toLocaleString("ru-RU")}% ассортимента из ${nf0.format(DATA.total_sku)} SKU · добавлено ${m.topn}`+
    (m.cutReason==="budget" ? " — дальше не хватило бюджета скидки"
     : m.cutReason==="limit" ? " — достигнут лимит, цель может быть не закрыта" : "");
  $("v-budget").textContent = state.budget>=BUDGET_MAX ? "без лимита"
    : state.budget.toLocaleString("ru-RU")+" млн ₽";
  $("v-spend").textContent = fmtRub(m.spend)+` (скидка ${m.discNew}%)`;

  $("k1").textContent=fmtRub(m.ai);
  $("k1d").textContent=`+${(m.ai/m.pm.base_rev*100).toLocaleString("ru-RU",{maximumFractionDigits:1})}% к ТО промо-категорий за ${state.month} · вклад ${m.topn} товаров ДЦО · программа месяца ${fmtRub(m.plan)} — на графике`;
  $("k3").textContent=nf0.format(Math.round(m.checksAdd));
  $("k3d").textContent=`+${(m.checksAdd/DATA.clients*100).toLocaleString("ru-RU",{maximumFractionDigits:1})}% к базе клиентов · отклик ${(DATA.resp_avg*100).toFixed(2)}% × ${m.topn} товаров`;
  $("k4").textContent="+"+nf0.format(Math.round(m.avgPrice))+" ₽";
  $("k4d").textContent=`+${(m.avgPrice/DATA.avg_check*100).toLocaleString("ru-RU",{maximumFractionDigits:0})}% к базовому чеку ${DATA.avg_check} ₽ · ср. цена добавляемого товара`;

  $("meters").innerHTML = m.meters.filter(x=>x.active).map(x=>`
    <div class="mrow">
      <div class="top"><b>${x.label}: цель +${x.pct}%</b><span class="pct">${x.closed.toLocaleString("ru-RU",{maximumFractionDigits:1})}%</span></div>
      <div class="track"><div class="fill" style="width:${x.closed.toFixed(1)}%; background:${x.color}"></div></div>
      <div class="note">цель ${x.fmt(x.target)} · прогноз ${x.fmt(x.cur)}</div>
    </div>`).join("");
  m.meters.forEach(x=>{
    const row=document.querySelector(`.goal[data-g="${x.g}"]`), inp=row.querySelector("input");
    row.setAttribute("data-active", String(x.active));
    inp.disabled = !x.active;
    if(x.active){ inp.value=state.targets[x.g]; $("vt-"+x.g).textContent=state.targets[x.g]; }
    else { inp.value=Math.min(15, x.pctCalc); $("vt-"+x.g).textContent=x.pctCalc.toFixed(1); }
  });
  const [d1,d2]=PERIOD[state.month];
  const discNew=m.pm.hist_disc+PROPOSE_PP;
  let rows=[...m.picked];
  const fc=state.tbl.cat.trim().toLowerCase(), fn=state.tbl.name.trim().toLowerCase();
  if(fc) rows=rows.filter(r=>r.cat.toLowerCase().includes(fc));
  if(fn) rows=rows.filter(r=>r.name.toLowerCase().includes(fn));
  const key=state.tbl.key, dir=state.tbl.dir;
  const val=r=>({cat:r.cat, name:r.name, disc:discNew, d1, d2, contrib:r.contrib})[key];
  rows.sort((a,b)=>{
    const va=val(a), vb=val(b);
    return (typeof va==="string" ? va.localeCompare(vb,"ru") : va-vb)*dir;
  });
  $("tblTitle").textContent=`ИИ добавляет: товары ДЦО (${rows.length}${rows.length!==m.topn?` из ${m.topn}`:""})`;
  const COLS=[["cat","Категория",""],["name","Название товара",""],["disc","Скидка","num"],
              ["d1","Дата с","num"],["d2","Дата по","num"],["contrib","Прогноз прироста","num"]];
  const thead=COLS.map(([k,t,cls])=>
    `<th class="${cls} sortable" data-key="${k}">${t}${key===k?(dir<0?" ▼":" ▲"):""}</th>`).join("");
  const tbody=rows.map(r=>
    `<tr><td class="cat">${esc(r.cat)}</td><td>${esc(r.name)}</td>`+
    `<td class="num">${discNew}%</td><td class="num">${d1}</td><td class="num">${d2}</td>`+
    `<td class="num">${nf0.format(Math.round(r.contrib))} ₽</td></tr>`).join("");
  $("tbl").innerHTML=`<thead><tr>${thead}</tr></thead><tbody>${tbody}</tbody>`;

  $("mLegend").innerHTML=`<span><i style="background:var(--gray-mark)"></i>факт прошлых месяцев</span>
    <span><i style="background:var(--c-orange)"></i>программа ${state.month}</span>
    <span><i style="background:var(--soft-orange)"></i>+ товары ДЦО от ИИ</span>`;

  $("formula").innerHTML=
    `<b>Какие показатели берёт модель</b>: из ассортимента (${nf0.format(DATA.total_sku)} SKU) — частота покупок (доля чеков с товаром), `+
    `выручка товара (чеки × средняя цена), средняя цена товара и средняя цена его категории; `+
    `из расчётов КД — клиентская база ${(DATA.clients/1e6).toLocaleString("ru-RU",{maximumFractionDigits:2})} млн и отклик ${(DATA.resp_avg*100).toFixed(2)}%; `+
    `средний чек ${DATA.avg_check} ₽ — из расчёта средних чеков; маржа ${Math.round(MARGIN*100)}%<br>`+
    `<b>Скоры целей</b> (методология I_PRODUCT_SCORE): ТО — доля товара в выручке · Трафик — доля чеков с товаром · `+
    `Средний чек — цена товара при широкой представленности · Маржа — цена товара к средней цене категории<br>`+
    `<b>Подбор</b>: выбираешь одну цель — товары добавляются по убыванию её скора, пока цель не закрыта `+
    `(лимиты — максимум товаров и бюджет скидки); остальные показатели рассчитываются от набора автоматически<br>`+
    `<b>Вклад товара</b> = доп чеки (клиенты × отклик) × цена · `+
    `<b>Прирост месяца</b> = программа «${state.month}» + вклад товаров ДЦО − среднее ${m.pm.hist_label}<br>`+
    `<b>Скидка</b> = средняя за ${m.pm.hist_label} (${m.pm.hist_disc}%) + ${PROPOSE_PP} п.п. — больше, но не менее того, что было · `+
    `<b>Планки целей</b>: ТО и маржа — % от выручки/маржи промо-категорий, трафик — % от клиентской базы, средний чек — % от ${DATA.avg_check} ₽`;

  drawMonths(m);
}

const mSel=$("month");
DATA.months.forEach(mm=>{const o=document.createElement("option");o.value=o.textContent=mm;mSel.appendChild(o);});
mSel.value=state.month;
mSel.addEventListener("change",()=>{state.month=mSel.value;render();});
document.querySelectorAll(".goal").forEach(g=>{
  const key=g.dataset.g;
  g.addEventListener("click",()=>{ if(state.goal!==key){ state.goal=key; render(); } });
  g.querySelector("input").addEventListener("input",e=>{
    if(key!==state.goal) return;
    state.targets[key]=+e.target.value;
    render();
  });
});
$("s-share").addEventListener("input",e=>{state.share=+e.target.value;render();});
$("excl").addEventListener("input",e=>{state.excl=e.target.value;render();});
$("s-budget").addEventListener("input",e=>{state.budget=+e.target.value;render();});
$("f-cat").addEventListener("input",e=>{state.tbl.cat=e.target.value;render();});
$("f-name").addEventListener("input",e=>{state.tbl.name=e.target.value;render();});
$("tbl").addEventListener("click",e=>{
  const th=e.target.closest("th[data-key]"); if(!th) return;
  const k=th.dataset.key;
  if(state.tbl.key===k) state.tbl.dir*=-1;
  else { state.tbl.key=k; state.tbl.dir = k==="contrib" ? -1 : 1; }
  render();
});
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(render,150);});
render();
</script>
</html>
